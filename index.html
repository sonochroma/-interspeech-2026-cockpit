<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Interspeech 2026 Cockpit</title><style>
:root{--ink:#17343d;--teal:#147d80;--navy:#123d4b;--bg:#f3f6f5;--line:#dbe5e2;--orange:#d7792c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}header{background:linear-gradient(120deg,var(--navy),#176f73);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 22px}h1{margin:2px 0;font-size:28px}.k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;opacity:.8}.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow:auto;padding:9px}.nav button,.pill{border:0;border-radius:999px;padding:10px 13px;font-weight:800;background:#e7efed;color:var(--ink);white-space:nowrap}.nav button.on{background:var(--navy);color:white}main{max-width:900px;margin:auto;padding:13px}.view{display:none}.view.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:0 2px 10px #00000008}.hero{border-left:5px solid var(--teal)}.hero h2{margin:2px 0}.target{background:#eaf4f1;border-radius:9px;padding:10px;margin-top:10px}.session summary{font-weight:800;cursor:pointer}.time{color:var(--teal);font-weight:900}.badge{font-size:10px;background:#edf2f0;border-radius:6px;padding:4px 6px;margin-left:6px}.q{background:#f1f6f6;padding:10px;border-radius:9px;font-weight:650;margin:9px 0}label{display:block;font-size:11px;font-weight:850;color:#65777c;margin:9px 0 3px}textarea,input,select{width:100%;border:1px solid #cad8d4;border-radius:9px;padding:10px;font:inherit}textarea{min-height:85px}.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;background:var(--orange);color:white;border:0;border-radius:999px;padding:15px 18px;font-weight:900;box-shadow:0 7px 22px #0004}.guard{border-left:5px solid var(--orange)}.small{font-size:13px;color:#65777c}.person{border-left:4px solid #315f9b}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{padding:10px;border:1px solid var(--line);background:white;border-radius:9px;font-weight:750}
</style></head><body><header><div class="k">Nurobodi · Sydney · Interspeech 2026</div><h1>Conference Cockpit</h1><div>People and questions over completeness.</div></header>
<div class="nav"><button class="on" onclick="show('today',this)">TODAY</button><button onclick="show('week',this)">WEEK</button><button onclick="show('questions',this)">QUESTIONS</button><button onclick="show('people',this)">PEOPLE</button><button onclick="show('talking',this)">TALKING NOTES</button><button onclick="show('synth',this)">SYNTHESIS</button></div><main>
<section id="today" class="view on"></section><section id="week" class="view"></section><section id="questions" class="view"></section><section id="people" class="view"></section><section id="talking" class="view"></section><section id="synth" class="view"></section></main>
<button class="fab" onclick="quick()">⚡ QUICK CAPTURE</button>
<script>
const days=[
["Sat 26","Enter the Community","Enter the research community before the main conference begins.","Meet 2–3 people worth reconnecting with.",[["09:30–12:30","PECRAC Early Career Researcher Annual Gathering","REGISTERED","Who could help me understand how an interdisciplinary researcher develops a durable place in speech/AI research?"]]],
["Sun 27","Methodological Bridge","Strengthen the bridge between relational theory and rigorous speech research.","3 methodological lessons + one useful conversation with Ramanarayanan or Proctor.",[["09:00–12:30","Deploying Speech Technologies for Linguistic and Clinical Research","PAID · SELECTED","How should an interdisciplinary research director decide whether a speech technology or representation is appropriate for the phenomenon?"]]],
["Mon 28","Poster & Relationships","Present clearly, invite serious critique, and turn the poster into relationships.","5 substantive conversations · 2 critiques · 3 follow-ups.",[["08:30–10:30","Opening + Hansen keynote","PROGRAM","Can I distinguish theoretical proposition, empirical probe and future design framework?"],["11:00–13:00","YOUR POSTER · Area 3 Poster 1 · Paper 2829","CORE","Where does this relational framing connect to your work — and what would weaken or falsify it?"],["13:00–14:30","Connecting Early Career Researchers","REGISTERED","Which emerging speech-AI problems need genuinely interdisciplinary approaches?"],["18:00–20:00","Welcome Reception","REGISTERED","Who do I genuinely want to continue thinking with after Sydney?"]]],
["Tue 29","Research + RMIT","Connect relational affect research to adjacent work while protecting the RMIT opportunity.","Protect interview · identify 2–3 intellectual neighbours.",[["12:10–12:50","RMIT interview preparation","PROTECTED","What are my strongest examples of translating emerging AI complexity into practical capability?"],["13:00–13:30","RMIT · Educator AI Capability Content Designer interview","PROTECTED","How do my research, education-design and responsible-AI practices translate into educator capability content?"],["16:30–18:30","Empathetic Dialogue and Interaction Dynamics","HIGH PRIORITY","How is interaction dynamics operationalised: coordination, adaptation, repair, alignment, synchrony, or something else?"]]],
["Wed 30","Convergence Day","Converge entrainment, representation learning, healthcare and responsible translation.","Build a Think · Build · Test · Open Doors relationship map.",[["09:00–11:00","Entrainment and Dialogue Coordination","HIGH PRIORITY","When does coordination imply coupling, and when is apparent synchrony misleading?"],["12:30–14:00","AI in Communication Sciences panel","HIGH PRIORITY","Where should inference about human communication be constrained, refused or kept assistive?"],["14:00–16:00","Speech & Language Technologies for Health","HIGH PRIORITY","Where does the interaction itself matter more than either person’s state independently?"]]],
["Thu 1","Integrate & Act","Integrate the week, test boundaries, and leave with next actions.","3 research changes · 3 Nurobodi implications · next action per key relationship.",[["09:00–11:00","Emotion, Prosody, and Articulation","HIGH PRIORITY","Which prosodic phenomena are interactionally meaningful versus individual expressive features?"],["14:00–16:00","Turn-taking","HIGH PRIORITY","Could turn-taking, repair and latency offer interpretable relational signals without claiming internal emotional state?"],["Late afternoon","Closing + synthesis","CORE","What changed enough to affect the next paper, experiment, pilot or professional move?"]]]];
const qs=["Where does affect belong when constituted through interaction?","How do entrainment, coordination, synchrony, coupling, accommodation and resonance differ?","What evidence moves directional dependence toward a meaningful relational construct?","What can SSL speech representations legitimately support us in claiming?","What interaction observables are useful without inferring private internal states?","Where would Vocal Interaction Field analysis be useful, invalid, dangerous, unwanted or surveillance-like?","What terminology do established researchers use for phenomena I call VIF, affective resonance or vitality dynamics?","What does rigorous study design look like for the next Nurobodi experiment?","What professional identity becomes legible when I explain this work?"];
const K="is26cockpit";let db=JSON.parse(localStorage.getItem(K)||'{"f":{},"p":[]}');function save(){localStorage.setItem(K,JSON.stringify(db))}function e(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function ta(id,l){return '<label>'+l+'</label><textarea oninput="db.f[\''+id+'\']=this.value;save()">'+e(db.f[id])+'</textarea>'}
function card(s,id){return '<details class="card session"><summary><span class=time>'+s[0]+'</span> · '+e(s[1])+' <span class=badge>'+s[2]+'</span></summary><div class=q>'+e(s[3])+'</div>'+ta(id+"n","Live notes")+ta(id+"p","People / institution")+ta(id+"t","Terminology / methods")+ta(id+"c","Challenge / support")+ta(id+"u","Nurobodi / ARDO / AARI relevance")+ta(id+"f","Follow-up / next action")+'</details>'}
function day(d,i){return '<div class="card hero"><div class=k>'+d[0]+'</div><h2>'+d[1]+'</h2><div>'+d[2]+'</div><div class=target><b>Target:</b> '+d[3]+'</div></div>'+d[4].map((s,j)=>card(s,"d"+i+"s"+j)).join("")}
function current(){let iso=new Date().toLocaleDateString("en-CA",{timeZone:"Australia/Sydney"}), dates=["2026-09-26","2026-09-27","2026-09-28","2026-09-29","2026-09-30","2026-10-01"],i=dates.indexOf(iso);return i<0?(iso<dates[0]?0:5):i}
function render(){today.innerHTML=day(days[current()],current());week.innerHTML=days.map(day).join("");questions.innerHTML='<div class="card hero"><h2>Questions I’m carrying</h2><div class=small>Let your position change as the conference pushes back.</div></div>'+qs.map((q,i)=>'<div class=card><b>'+e(q)+'</b>'+ta("q"+i,"Notes / evolving position")+'</div>').join("");people.innerHTML='<div class="card hero"><h2>People & Encounters</h2><button class=pill onclick="add()">+ New encounter</button></div>'+db.p.map((p,i)=>'<div class="card person"><input placeholder="Person" value="'+e(p.n)+'" oninput="db.p['+i+'].n=this.value;save()"><input placeholder="Institution" value="'+e(p.o)+'" oninput="db.p['+i+'].o=this.value;save()"><select onchange="db.p['+i+'].r=this.value;save()">'+["Think with me","Build with me","Test with me","Open doors with me"].map(x=>'<option '+(p.r===x?"selected":"")+'>'+x+'</option>').join("")+'</select><textarea placeholder="Why this encounter matters / follow-up" oninput="db.p['+i+'].x=this.value;save()">'+e(p.x)+'</textarea></div>').join("");
talking.innerHTML='<div class="card hero"><h2>Talking Notes · Fast Reference</h2><div>Use the 21-page PDF for depth. Keep these three guardrails one tap away.</div></div><div class="card guard"><b>MEASUREMENT, NOT FELT AFFECT</b><p>Directional predictive dependence between vocal representations. Not felt affect, psychological causation, or a resonance mechanism.</p></div><div class="card guard"><b>SAY “WEAKENS”, NOT “COLLAPSES”</b><p>AMI approaches a near-zero exclusive-speech floor; later DipCo work retains structure.</p></div><div class="card guard"><b>GRANGER = PREDICTIVE CORRELATE</b><p>Say predicts, helps forecast, or leads — not causes, determines, or drives.</p></div><div class=card><h3>20-second hook</h3><p>Most emotion AI asks what one person is feeling. We asked a different question: does the interaction itself — the relationship between voices — leave a measurable signature? In four-person meetings we found directional coupling between speakers’ voices. It is strongest when people overlap, happens within less than a second, and weakens outside simultaneous vocal overlap.</p></div>';
synth.innerHTML='<div class="card hero"><h2>Post-Conference Synthesis</h2></div>'+["What changed my thinking?","Three research changes","Three Nurobodi implications","Terms to adopt","Terms to use cautiously","What can I defend better now?","What can I still not defend confidently?","Next experiment / analysis change","48-hour actions"].map((x,i)=>'<div class=card><b>'+x+'</b>'+ta("post"+i,"")+'</div>').join("")+'<div class=card><div class=tools><button onclick=backup()>Export JSON backup</button></div><div class=small>Notes autosave locally in Safari. Export daily.</div></div>'}
function show(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");scrollTo(0,0)}function add(){db.p.unshift({n:"",o:"",r:"Think with me",x:""});save();render();show("people",document.querySelectorAll(".nav button")[3])}function quick(){add();setTimeout(()=>document.querySelector("#people input")?.focus(),50)}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="Interspeech_2026_Cockpit_Backup.json";a.click()}render();
</script></body></html>
