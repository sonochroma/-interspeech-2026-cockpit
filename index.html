const K="is26fieldbook-v3";let db=JSON.parse(localStorage.getItem(K)||'{"notes":{},"quick":[],"threads":{},"states":{}}');let lens="research",day=0,capType="idea",editQuickId=null;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const save=()=>localStorage.setItem(K,JSON.stringify(db));
function nav(){dayNav.innerHTML=D.map((x,i)=>'<button class="'+(i===day?'on':'')+'" onclick="go('+i+')">'+x.d+'</button>').join("")}
function lensText(b){let idx={research:9,professional:10,rnd:11,expansion:12}[lens];return b[idx]||"Follow the question that is alive for you."}
function note(id,ph="Write what you notice…",big=false){return '<div class="'+(big?'big':'')+'"><textarea placeholder="'+ph+'" oninput="db.notes[\''+id+'\']=this.value;save()">'+esc(db.notes[id])+'</textarea></div>'}
function event(b,i){let id="d"+day+"e"+i;return '<details class="event '+(b[3]==="lock"?"core":"")+'"><summary><span class="time">'+b[0]+'</span> · <b>'+b[1]+'</b><span class="status '+b[3]+'">'+b[4]+'</span><div class="room">'+b[2]+'</div></summary><div class="why"><b>Why this may matter now</b><div>'+b[6]+'</div></div><div class="panel" style="padding:11px"><div class="eyebrow">Active lens · '+({research:"Research Cy",professional:"Professional Cy",rnd:"Nurobodi R&D",expansion:"Nurobodi Expansion"}[lens])+'</div><div>'+lensText(b)+'</div></div><div class="q"><b>Question to carry</b><div class="quote">“'+b[7]+'”</div></div>'+note(id,"Notes · terminology · people · challenges · connections…")+'<div class="actions"><button onclick="promote(\''+id+'\',\'thread\')">Promote to thread</button><button onclick="promote(\''+id+'\',\'person\')">Person to find</button><button onclick="openAlternatives()">What else is happening?</button></div></details>'}
function lensIntro(){return {research:"Follow theory, constructs, methods and evidence.",professional:"Follow people, institutions, capabilities and career possibilities.",rnd:"Follow representations, observables, validation, datasets and experiments.",expansion:"Follow stakeholders, research partners, pilot contexts and ecosystem relationships."}[lens]}
function render(){nav();lensContext.innerHTML="<b>"+({research:"Research Cy",professional:"Professional Cy",rnd:"Nurobodi R&D",expansion:"Nurobodi Expansion"}[lens])+"</b> · "+lensIntro();let x=D[day];app.innerHTML='<section class="page on"><div class="hero"><div class="eyebrow">'+x.d+' · '+x.title+'</div><h2>'+x.intent+'</h2><div class="carry"><b>Carry forward</b><br>'+x.carry+'</div></div><div class="grid"><div><div class="sectiontitle">My field notes</div><div class="note big">'+note("day"+day,"Write freely. Ideas do not need to fit a form.",true)+'</div><div class="sectiontitle">The conference · complete paths for this day</div><div class="timeline">'+x.blocks.map(event).join("")+'</div></div><aside><div class="panel"><div class="eyebrow">This day · use it</div><h3>Act on what happens</h3><div class="actions"><button onclick="openCapture()">Capture this moment</button><button onclick="focusNext()">What should I look at next?</button></div><div class="small">Session intelligence, people and questions belong in the chronological event cards below—not in a generic dashboard.</div></div><div class="panel"><div class="eyebrow">Living threads</div><div id="threads">'+threads()+'</div></div><div class="panel"><div class="eyebrow">Quick captures</div>'+db.quick.slice().reverse().map(q=>'<div class="captureitem"><b>'+esc(q.type)+' · '+esc(q.day)+'</b><div>'+esc(q.text)+'</div><div class="actions"><button onclick="editQuick(\''+q.id+'\')">Edit</button><button onclick="deleteQuick(\''+q.id+'\')">Delete</button></div></div>').join("")+'<div class="small">'+(db.quick.length?"":"Nothing captured yet.")+'</div></div><div class="panel"><button class="ghost" onclick="backup()">Export local backup</button><div class="small">Your typed notes are stored locally on this device, not in the public GitHub source.</div></div></aside></div><div class="footerNav"><button onclick="go(Math.max(0,day-1))">‹ Previous</button><button onclick="go(Math.min(D.length-1,day+1))">Next day ›</button></div></section>'}
function threads(){let a=Object.entries(db.threads);return a.length?a.map(([k,v])=>'<div class="thread">'+esc(v)+'</div>').join(""):'<div class="small">Promote a note, question or encounter here. Threads can compound across days.</div>'}
function promote(id,type){let v=db.notes[id]||"";let t=prompt(type==="person"?"Who do you want to find, and why?":"Name the developing thread:",v.slice(0,100));if(t){db.threads[Date.now()]=t;save();render()}}
function go(i){day=i;render();scrollTo(0,0)}document.querySelectorAll(".lens").forEach(b=>b.onclick=()=>{document.querySelectorAll(".lens").forEach(x=>x.classList.remove("on"));b.classList.add("on");lens=b.dataset.lens;render()});
function openCapture(){editQuickId=null;capType="idea";quickText.value="";capture.classList.add("on");quickText.focus()}
function closeCapture(){capture.classList.remove("on");editQuickId=null;quickText.value=""}
function editQuick(id){let q=db.quick.find(x=>x.id===id);if(!q)return;editQuickId=id;capType=q.type;quickText.value=q.text;capture.classList.add("on");quickText.focus()}
function deleteQuick(id){if(confirm("Delete this capture?")){db.quick=db.quick.filter(x=>x.id!==id);save();render()}}
function saveQuick(){let t=quickText.value.trim();if(t){if(editQuickId){let q=db.quick.find(x=>x.id===editQuickId);if(q){q.text=t;q.type=capType;q.edited=new Date().toISOString()}}else{db.quick.push({id:"q"+Date.now(),type:capType,text:t,day:D[day].d,ts:new Date().toISOString()})}save();render()}closeCapture()}
function focusNext(){let ev=[...document.querySelectorAll(".event")];let target=ev.find(x=>!x.open)||ev[0];if(target){target.open=true;target.scrollIntoView({behavior:"smooth",block:"center"})}}
function openAlternatives(){alert("The full concurrent block remains visible in this day timeline. Close this card and compare the neighbouring events; future enrichment will add paper-level timing and people radar.")}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="Interspeech_2026_Fieldbook_Backup.json";a.click()}
db.quick.forEach((q,i)=>{if(!q.id)q.id="legacy"+i});save();let dates=["2026-09-27","2026-09-28","2026-09-29","2026-09-30","2026-10-01"],today=new Date().toLocaleDateString("en-CA",{timeZone:"Australia/Sydney"}),ix=dates.indexOf(today);if(ix>=0)day=ix;render();
</script></body></html>
